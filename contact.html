  <main class="contact">

    <section>
      <h1>Kontakt</h1>

      <div class="contact-info">
        <p><strong>Adress:</strong> Storgatan 12, 111 22 Västköping</p>
        <p><strong>Telefon:</strong> 066-123 45 67</p>
        <p><strong>E-post:</strong> info@fornone.ro</p>
      </div>

      <div class="opening-hours">
        <h2>Öppettider</h2>
        <p>Måndag–Torsdag: 12:00–21:00</p>
        <p>Fredag–Söndag: 12:00–23:00</p>
      </div>

      <div class="contact-form">
        <h2>Skicka meddelande</h2>

        <form>
          <input type="text" placeholder="Namn" required>
          <input type="email" placeholder="E-post" required>
          <textarea placeholder="Meddelande"></textarea>
          <button type="submit">Skicka</button>
        </form>

      </div>

    </section>

  </main>

  <footer>
    <p>© 2026 Forno Nero</p>
